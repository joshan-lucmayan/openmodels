[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmodels"
version = "0.1.0"
description = "An evolving adversarial intelligence platform that continuously searches for weaknesses in complex systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "OpenModels Contributors" },
]
keywords = [
    "security",
    "adversarial",
    "testing",
    "research",
    "fuzzing",
    "ai",
    "intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
openmodels = "openmodels.main:cli"

[tool.setuptools.packages.find]
include = ["openmodels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Imported domain models named Test* (TestSpec/TestOutcome) must not be
# collected as pytest test classes.
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
